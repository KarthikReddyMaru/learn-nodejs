type User {
    email: String! @unique(constraintName: "email_unique")
    userId: ID! @id
    firstName: String
    lastName: String

    assignedTasks: [Task!]! @relationship(type: "ASSIGNED_TO", direction: IN, properties: "TaskAssigneeProperties")
    org: Org @relationship(type: "WORKS_AT", direction: OUT)
}

input UserInput {
    email: String!
    firstName: String
    lastName: String
}

extend type Query {
    user: User
}

extend type Mutation {
    createUser(user: UserInput!): User!
}